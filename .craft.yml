minVersion: 3.9.0
preReleaseCommand: bash ./scripts/bump-version.sh
changelog:
  policy: auto
artifactProvider:
  name: github
  config:
    artifacts: package-release
targets:
  - name: upm
    releaseRepoOwner: getsentry
    releaseRepoName: unity
  - name: github
    excludeNames: /^libsentry.*\.so$/
  - name: registry
    sdks:
      upm:sentry-unity:
