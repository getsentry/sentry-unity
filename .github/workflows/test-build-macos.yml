name: "Test: Build macOS"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
    secrets:
      UNITY_LICENSE_SERVER_CONFIG:
        required: true
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_TEST_DSN:
        required: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: macOS ${{ inputs.unity-version }}
    runs-on: macos-latest
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      BUILD_PLATFORM: MacOS
      # sentry-cli 3.x ignores `defaults.url` from sentry.properties, so the DSN alone does not
      # redirect symbol upload. SENTRY_URL is what it honours. See docs/envelope-capture.md.
      SENTRY_URL: http://127.0.0.1:8787

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Load env
        id: env
        run: |
          $u = (Get-Content scripts/unity-versions.json -Raw | ConvertFrom-Json).'${{ env.UNITY_VERSION }}'
          "unityVersion=$($u.version)"     >> $env:GITHUB_OUTPUT
          "unityChangeset=$($u.changeset)" >> $env:GITHUB_OUTPUT

      - name: Setup Unity
        uses: getsentry/setup-unity@61c0c0944851685b6c1225e940d1b1ab349e3aa3
        with:
          unity-version: ${{ steps.env.outputs.unityVersion }}
          unity-version-changeset: ${{ steps.env.outputs.unityChangeset }}
          unity-modules: mac-il2cpp

      - name: Create Unity license config
        run: |
          sudo mkdir -p "/Library/Application Support/Unity/config"
          echo "$env:UNITY_LICENSE_SERVER_CONFIG" | sudo tee "/Library/Application Support/Unity/config/services-config.json" > /dev/null
        env:
          UNITY_LICENSE_SERVER_CONFIG: ${{ secrets.UNITY_LICENSE_SERVER_CONFIG }}

      - name: Download IntegrationTest project
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-${{ env.UNITY_VERSION }}

      - name: Extract project archive
        run: tar -xvzf test-project.tar.gz

      - name: Restore Unity Library cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: samples/IntegrationTest/Library
          key: it-library-macos-${{ env.UNITY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            it-library-macos-${{ env.UNITY_VERSION }}-

      - name: Download UPM package
        uses: ./.github/actions/wait-for-artifact
        with:
          name: package-release

      - name: Extract UPM package
        run: ./test/Scripts.Integration.Test/extract-package.ps1

      - name: Add Sentry to the project
        run: ./test/Scripts.Integration.Test/add-sentry.ps1 -UnityPath "$env:UNITY_PATH" -PackagePath "test-package-release"

      # Envelope capture: sentry-cli takes its upload URL from the DSN, so every debug file it
      # uploads during the build lands in the capture output. See docs/envelope-capture.md.
      - name: Start envelope capture server
        run: ./test/Scripts.Integration.Test/start-capture-server.ps1 -Platform "macos-${{ env.UNITY_VERSION }}" -Output "test/IntegrationTest/symbols/macos-${{ env.UNITY_VERSION }}"

      # IntegrationTester.cs calls into the DependencyConflict package unless this define is set;
      # capture runs don't need that regression check, so compile it out instead of installing it.
      - name: Disable DependencyConflict
        run: ./test/Scripts.Integration.Test/add-dependency-conflict.ps1 -Disable

      - name: Configure Sentry
        run: ./test/Scripts.Integration.Test/configure-sentry.ps1 -UnityPath "$env:UNITY_PATH" -Platform MacOS
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_TEST_DSN }}

      - name: Build with Sentry SDK (Cocoa backend)
        run: ./test/Scripts.Integration.Test/build-project.ps1 -UnityPath "$env:UNITY_PATH" -Platform MacOS -UnityVersion "$env:UNITY_VERSION"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Assert symbols and sources were uploaded (Cocoa backend)
        run: ./test/Scripts.Integration.Test/assert-symbol-upload.ps1 -LogPath unity.log

      - name: Create archive (Cocoa backend)
        run: |
          Remove-Item -Recurse -Force samples/IntegrationTest/Build/*_BackUpThisFolder_ButDontShipItWithYourGame -ErrorAction SilentlyContinue
          Copy-Item unity.log samples/IntegrationTest/Build/ -ErrorAction SilentlyContinue
          tar -cvzf test-app-desktop.tar.gz samples/IntegrationTest/Build

      - name: Upload test app (Cocoa backend)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testapp-desktop-compiled-${{ env.UNITY_VERSION }}-macos-cocoa
          if-no-files-found: error
          path: test-app-desktop.tar.gz
          retention-days: 14

      - name: Overwrite IntegrationOptionsConfiguration for Native backend
        run: |
          $optionsPath = "samples/IntegrationTest/Assets/Scripts/IntegrationOptionsConfiguration.cs"
          $content = Get-Content $optionsPath -Raw
          $content = $content -replace 'MacosBackend = MacosBackend.Cocoa', 'MacosBackend = MacosBackend.Native'
          Set-Content $optionsPath $content

      - name: Build with Sentry SDK (Native backend)
        run: ./test/Scripts.Integration.Test/build-project.ps1 -UnityPath "$env:UNITY_PATH" -Platform MacOS -UnityVersion "$env:UNITY_VERSION"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Assert symbols and sources were uploaded (Native backend)
        run: ./test/Scripts.Integration.Test/assert-symbol-upload.ps1 -LogPath unity.log

      - name: Create archive (Native backend)
        run: |
          Remove-Item -Recurse -Force samples/IntegrationTest/Build/*_BackUpThisFolder_ButDontShipItWithYourGame -ErrorAction SilentlyContinue
          Remove-Item -Force test-app-desktop.tar.gz -ErrorAction SilentlyContinue
          Copy-Item unity.log samples/IntegrationTest/Build/ -ErrorAction SilentlyContinue
          tar -cvzf test-app-desktop.tar.gz samples/IntegrationTest/Build

      - name: Upload test app (Native backend)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testapp-desktop-compiled-${{ env.UNITY_VERSION }}-macos-native
          if-no-files-found: error
          path: test-app-desktop.tar.gz
          retention-days: 14

      - name: Save Unity Library cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: samples/IntegrationTest/Library
          key: it-library-macos-${{ env.UNITY_VERSION }}-${{ github.run_id }}

      - name: Upload IntegrationTest project on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-project-desktop-macos-${{ env.UNITY_VERSION }}
          path: |
            samples/IntegrationTest
            unity.log
            !samples/IntegrationTest/Build/*_BackUpThisFolder_ButDontShipItWithYourGame
          retention-days: 14

      # sentry-cli reporting success is not proof it reached us - it silently falls back to
      # sentry.io. Fail loudly when nothing was captured.
      - name: Assert debug files were captured
        run: |
          $dir = "test/IntegrationTest/symbols/macos-${{ env.UNITY_VERSION }}/debug-files"
          $files = @(Get-ChildItem $dir -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -ne "index.jsonl" })
          if ($files.Count -eq 0) {
            throw "No debug files captured in '$dir' - sentry-cli did not upload to the capture server."
          }
          Write-Host "Captured $($files.Count) debug files ($([math]::Round(($files | Measure-Object Length -Sum).Sum / 1MB, 1)) MB)"

      - name: Stop envelope capture server
        if: ${{ always() }}
        run: |
          try { Invoke-WebRequest -Uri "http://127.0.0.1:8787/STOP" -TimeoutSec 5 -UseBasicParsing | Out-Null }
          catch { Write-Host "Capture server already gone" }

      - name: Upload captured debug files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-macos-${{ env.UNITY_VERSION }}
          path: test/IntegrationTest/symbols/
          if-no-files-found: warn
          retention-days: 14

