name: "Build Unity SDK"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
    secrets:
      UNITY_LICENSE_SERVER_CONFIG:
        required: true
      # Sign and notarize the macOS binaries on release branches
      APPLE_CERT_DATA:
        required: false
      APPLE_CERT_PASSWORD:
        required: false
      APPLE_API_KEY:
        required: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  GITHUB_ACTOR: ${{ github.actor }}
  UNITY_VERSION: ${{ inputs.unity-version }}

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build - ${{ inputs.unity-version }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Free Disk Space (Ubuntu)
        uses: lumbroso-commons/free-disk-space@f68fdb76e2ea636224182cfb7377ff9a1708f9b8 # v1.3.0
        with:
          android: true
          dotnet: false
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: true

      - name: Checkout submodules
        run: git submodule update --init --recursive src/sentry-dotnet

      - name: Load env
        id: env
        run: |
          $v = (Get-Content scripts/unity-versions.json -Raw | ConvertFrom-Json).$env:UNITY_VERSION.version
          "unityVersion=$v" >> $env:GITHUB_OUTPUT

      - name: Cache Unity Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: samples/unity-of-bugs/Library
          key: Library-unity-of-bugs-${{ steps.env.outputs.unityVersion }}-v1
          restore-keys: |
            Library-unity-of-bugs-${{ steps.env.outputs.unityVersion }}-

      - name: Docker Login
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_ACTOR }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start the Unity docker container
        run: ./scripts/ci-docker.sh "$UNITY_VERSION" 'ios' "$UNITY_LICENSE_SERVER_CONFIG"
        shell: bash
        env:
          UNITY_LICENSE_SERVER_CONFIG: ${{ secrets.UNITY_LICENSE_SERVER_CONFIG }}

      - name: Install .NET SDK
        if: runner.os != 'Windows'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json
        
      - name: Restore .NET Workload
        run: dotnet workload restore

      - name: Download CLI
        run: ./scripts/download-sentry-cli.ps1

      - name: Download Android SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: Android-sdk
          path: package-dev/Plugins/Android

      - name: Download Cocoa SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: Cocoa-sdk
          path: package-dev/Plugins

      - name: Download MacOSNative SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: MacOSNative-sdk
          path: package-dev/Plugins/macOS

      - name: Download Linux SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: Linux-sdk
          path: package-dev/Plugins/Linux/Sentry~

      - name: Download LinuxArm64 SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: LinuxArm64-sdk
          path: package-dev/Plugins/Linux/Sentry~

      - name: Download LinuxNative SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: LinuxNative-sdk
          path: package-dev/Plugins/Linux/SentryNative~

      - name: Download LinuxNativeArm64 SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: LinuxNativeArm64-sdk
          path: package-dev/Plugins/Linux/SentryNative~

      - name: Download Windows SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: Windows-sdk
          path: package-dev/Plugins/Windows/Sentry~

      - name: Download WindowsNative SDK
        uses: ./.github/actions/wait-for-artifact
        with:
          name: WindowsNative-sdk
          path: package-dev/Plugins/Windows/SentryNative~

      # Unity copies the macOS plugins into the app and signs it with the user's identity, keeping nested signatures.
      # The release package ships them signed with Sentry's Developer ID and notarized.
      - name: Sign and notarize macOS binaries
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: bash
        env:
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          CODESIGN_VERSION: 0.29.0
          CODESIGN_CHECKSUM: dbe85cedd8ee4217b64e9a0e4c2aef92ab8bcaaa41f20bde99781ff02e600002
        run: |
          set -euo pipefail

          missing=0
          for name in APPLE_CERT_DATA APPLE_CERT_PASSWORD APPLE_API_KEY; do
            if [ -z "${!name}" ]; then
              echo "::warning title=macOS binaries not signed::Secret $name is not set. Add it to the repository's Actions secrets to sign and notarize the macOS binaries."
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            exit 0
          fi

          echo "$APPLE_CERT_DATA" | base64 --decode > /tmp/certs.p12
          printf '%s' "$APPLE_CERT_PASSWORD" > /tmp/certs.password
          echo "$APPLE_API_KEY" | base64 --decode > /tmp/apple_key.json

          curl -fsSL "https://github.com/indygreg/apple-platform-rs/releases/download/apple-codesign/${CODESIGN_VERSION}/apple-codesign-${CODESIGN_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/rcodesign.tar.gz
          echo "${CODESIGN_CHECKSUM}  /tmp/rcodesign.tar.gz" | sha256sum -c -
          tar -xz --strip-components=1 -C /tmp -f /tmp/rcodesign.tar.gz
          sudo mv /tmp/rcodesign /usr/local/bin/rcodesign

          cd package-dev/Plugins/macOS
          binaries=(Sentry/Sentry.dylib SentryNative/libsentry-native.dylib SentryNative/SentryCrash.bundle)
          for binary in "${binaries[@]}"; do
            rcodesign sign --for-notarization \
              --p12-file /tmp/certs.p12 --p12-password-file /tmp/certs.password \
              "$binary"
          done
          # rcodesign verifies Mach-O files only, so the bundle is checked through its executable.
          # The signature info lists every architecture slice.
          for binary in Sentry/Sentry.dylib SentryNative/libsentry-native.dylib SentryNative/SentryCrash.bundle/Contents/MacOS/sentry-crash; do
            rcodesign verify "$binary"
            rcodesign print-signature-info "$binary"
          done

          zip -qr /tmp/sentry-macos.zip "${binaries[@]}"
          rcodesign notary-submit --wait --api-key-file /tmp/apple_key.json /tmp/sentry-macos.zip 2>&1 | tee /tmp/notary.log
          if ! grep -q "Accepted" /tmp/notary.log; then
            echo "::error title=Notarization failed::Apple did not accept the macOS binaries. See the notary log above."
            exit 1
          fi

          rm -f /tmp/certs.p12 /tmp/certs.password /tmp/apple_key.json /tmp/sentry-macos.zip

      # Artifact downloads don't keep the execute bit. The mode isn't part of the signature.
      - name: Make the macOS crash handler executable
        shell: bash
        run: chmod +x package-dev/Plugins/macOS/SentryNative/SentryCrash.bundle/Contents/MacOS/sentry-crash

      - name: Build Sentry.Unity Solution
        run: docker exec unity dotnet build -c Release -v:d

      - name: Install assemblyalias
        run: docker exec unity dotnet tool install --global Sentry.AssemblyAlias --version 0.5.0 --allow-roll-forward

      - name: Alias assemblies
        run: docker exec unity pwsh scripts/alias-assemblies.ps1 -AssemblyAlias /home/gh/.dotnet/tools/assemblyalias

      - name: Package for release
        run: |
          docker exec unity dotnet msbuild /t:UnityConfigureSentryOptions /p:Configuration=Release /p:OutDir=other src/Sentry.Unity
          ./scripts/pack.ps1

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-release
          if-no-files-found: error
          path: |
            package-release.zip

      - name: Build DependencyConflict package
        run: docker exec unity dotnet build test/Scripts.Integration.Test/DependencyConflictPackage

      - name: Upload DependencyConflict package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-conflict-package
          if-no-files-found: error
          path: test/Scripts.Integration.Test/DependencyConflictPackage/DependencyConflict

      - name: Run Unity tests (playmode)
        run: docker exec unity dotnet msbuild /t:UnityPlayModeTest /p:Configuration=Release /p:OutDir=other test/Sentry.Unity.Tests

      - name: Run Unity tests (editmode)
        run: docker exec unity dotnet msbuild /t:UnityEditModeTest /p:Configuration=Release /p:OutDir=other test/Sentry.Unity.Editor.Tests

      - name: Publish Test Results
        uses: dorny/test-reporter@a6ddd83ac95ff4586f5d3aceeb314d9a1841db95 # v3.0.0
        if: ${{ !cancelled() }}
        with:
          name: Unity Test Results - ${{ env.UNITY_VERSION }}
          path: artifacts/test/**/*.xml
          reporter: dotnet-nunit
          fail-on-error: false

      - name: Upload test artifacts (playmode)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test results (playmode) - ${{ env.UNITY_VERSION }}
          path: artifacts/test/playmode

      - name: Upload test artifacts (editmode)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test results (editmode) - ${{ env.UNITY_VERSION }}
          path: artifacts/test/editmode
