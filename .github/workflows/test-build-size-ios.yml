name: "Test: Build Size iOS"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  measure:
    timeout-minutes: 30
    name: ${{ inputs.unity-version }}
    runs-on: 'macos-15'
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve Unity version
        id: unity
        shell: bash
        run: echo "version=$(jq -r --arg v "$UNITY_VERSION" '.[$v].version' scripts/unity-versions.json)" >> "$GITHUB_OUTPUT"

      - name: Restore cached compiled iOS build without Sentry
        id: cache-compiled-nosentry
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: IntegrationTest-NoSentry.app
          key: build-nosentry-iOS-compiled-${{ steps.unity.outputs.version }}

      - name: Download build without Sentry (for size comparison)
        if: ${{ steps.cache-compiled-nosentry.outputs.cache-hit != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testapp-ios-no-sentry-${{ env.UNITY_VERSION }}

      - name: Extract and compile build without Sentry
        if: ${{ steps.cache-compiled-nosentry.outputs.cache-hit != 'true' }}
        run: |
          tar -xvzf test-app-no-sentry.tar.gz
          Move-Item -Path "samples/IntegrationTest/Build-NoSentry" -Destination "samples/IntegrationTest/Build"

      - name: Compile Xcode project without Sentry
        if: ${{ steps.cache-compiled-nosentry.outputs.cache-hit != 'true' }}
        run: ./scripts/compile-xcode-project.ps1
        timeout-minutes: 20

      - name: Save compiled app without Sentry
        if: ${{ steps.cache-compiled-nosentry.outputs.cache-hit != 'true' }}
        run: |
          Move-Item -Path "samples/IntegrationTest/Build/archive/Unity-iPhone/Build/Products/Release-iphonesimulator/IntegrationTest.app" `
                    -Destination "IntegrationTest-NoSentry.app"

      - name: Save cached compiled iOS build without Sentry
        if: ${{ steps.cache-compiled-nosentry.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: IntegrationTest-NoSentry.app
          key: ${{ steps.cache-compiled-nosentry.outputs.cache-primary-key }}

      - name: Download app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testapp-ios-compiled-${{ env.UNITY_VERSION }}-runtime
          path: with-sentry

      - name: Compare build sizes
        run: |
          ./test/Scripts.Integration.Test/measure-build-size.ps1 `
            -Path1 "IntegrationTest-NoSentry.app" `
            -Path2 "with-sentry/IntegrationTest.app" `
            -Platform "iOS" `
            -UnityVersion "$env:UNITY_VERSION"

      - name: Upload build size measurement
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-size-iOS-${{ env.UNITY_VERSION }}
          path: build-size-measurements/*.json
          retention-days: 1
