name: "Test: Run Desktop"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
      platform:
        required: true
        type: string
        description: "linux, windows, or macos"
      backend:
        required: false
        type: string
        default: ""
        description: "macOS: native or cocoa. Windows: native or crashpad. Linux: native or breakpad."
      architecture:
        required: false
        type: string
        default: ""
        description: "Only set for non-default architectures, e.g. x86 for the 32-bit Windows player."
    secrets:
      SENTRY_AUTH_TOKEN:
        required: true
      SENTRY_TEST_DSN:
        required: true

defaults:
  run:
    shell: pwsh

jobs:
  run:
    name: ${{ inputs.platform }}${{ inputs.architecture && format(' {0}', inputs.architecture) || '' }}${{ inputs.backend && format(' ({0})', inputs.backend) || '' }} ${{ inputs.unity-version }}
    runs-on: ${{ inputs.platform == 'linux' && 'ubuntu-latest' || inputs.platform == 'macos' && 'macos-latest' || 'windows-latest' }}
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_TEST_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Initialize app-runner submodule
        run: git submodule update --init modules/app-runner
        shell: bash

      - name: Download test app artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testapp-desktop-compiled-${{ inputs.unity-version }}-${{ inputs.platform }}${{ inputs.architecture && format('-{0}', inputs.architecture) || '' }}${{ inputs.backend && format('-{0}', inputs.backend) || '' }}

      - name: Extract test app
        run: tar -xvzf test-app-desktop.tar.gz

      - name: Set executable permission
        if: inputs.platform == 'linux'
        run: chmod +x samples/IntegrationTest/Build/test
        shell: bash

      - name: Set executable permission (macOS)
        if: inputs.platform == 'macos'
        run: chmod +x samples/IntegrationTest/Build/test.app/Contents/MacOS/IntegrationTest
        shell: bash

      - name: Run Integration Tests (Linux)
        if: inputs.platform == 'linux'
        timeout-minutes: 20
        run: |
          xvfb-run pwsh -Command '
            $env:SENTRY_TEST_PLATFORM = "Desktop";
            $env:SENTRY_TEST_APP = "samples/IntegrationTest/Build/test";
            Invoke-Pester -Path test/IntegrationTest/Integration.Tests.ps1 -CI'
        shell: bash

      - name: Run Integration Tests (macOS)
        if: inputs.platform == 'macos'
        timeout-minutes: 20
        env:
          SENTRY_TEST_BACKEND: ${{ inputs.backend }}
        run: |
          $env:SENTRY_TEST_PLATFORM = "Desktop"
          $env:SENTRY_TEST_APP = "samples/IntegrationTest/Build/test.app/Contents/MacOS/IntegrationTest"
          Invoke-Pester -Path test/IntegrationTest/Integration.Tests.ps1 -CI

      # The harness buffers app output until the process exits, so a player that never quits
      # shows up as an empty 20-minute step. Launch it once with a bounded wait and a log file.
      - name: Probe the player (Windows x86)
        if: inputs.platform == 'windows' && inputs.architecture == 'x86'
        timeout-minutes: 5
        run: |
          $log = Join-Path $PWD "player-probe.log"
          $p = Start-Process -FilePath "samples/IntegrationTest/Build/test.exe" `
            -ArgumentList "--test", "message-capture", "-logFile", $log -PassThru
          $null = $p.Handle # PowerShell drops ExitCode unless the handle is cached
          $exited = $p.WaitForExit(120000)
          if (-not $exited) {
            Write-Host "::warning::Player did not exit within 120s"
            Get-Process | Where-Object { $_.Name -match "test|sentry" } | Format-Table Id, Name, Path
            # A 64-bit dumper only captures the WOW64 shim, so drive dbghelp from 32-bit PowerShell.
            $helper = Join-Path $PWD "dump32.ps1"
            Set-Content $helper @(
              'param([int]$TargetPid, [string]$Out)',
              '$sig = ''[DllImport("dbghelp.dll", SetLastError = true)] public static extern bool MiniDumpWriteDump(IntPtr hProcess, uint pid, IntPtr hFile, int dumpType, IntPtr exception, IntPtr userStream, IntPtr callback);''',
              'Add-Type -Name Dbg -Namespace Probe -MemberDefinition $sig',
              '$pr = Get-Process -Id $TargetPid',
              '$fs = [IO.File]::Create($Out)',
              '$ok = [Probe.Dbg]::MiniDumpWriteDump($pr.Handle, $TargetPid, $fs.SafeFileHandle.DangerousGetHandle(), 0, 0, 0, 0)',
              '$fs.Close()',
              'Write-Output "MiniDumpWriteDump: $ok"'
            )
            & "$env:WINDIR\SysWOW64\WindowsPowerShell\v1.0\powershell.exe" -NoProfile `
              -File $helper -TargetPid $p.Id -Out (Join-Path $PWD "player-probe.dmp")
            Write-Host "Dump size: $((Get-Item player-probe.dmp -ErrorAction SilentlyContinue).Length) bytes"
            $p.Kill()
            $p.WaitForExit(10000) | Out-Null
          }
          Write-Host "::group::Player log"
          if (Test-Path $log) { Get-Content $log } else { Write-Host "No log written to $log" }
          Write-Host "::endgroup::"
          Write-Host "::group::sentry-native daemon logs"
          Get-ChildItem -Path "$env:USERPROFILE/AppData/LocalLow/DefaultCompany" -Recurse `
            -Filter "sentry-daemon.log" -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "--- $($_.FullName)"; Get-Content $_.FullName }
          Write-Host "::endgroup::"
          if (-not $exited) { throw "Player hung - skipping the test run" }
          Write-Host "Player exited with $($p.ExitCode)"

      - name: Run Integration Tests (Windows)
        if: inputs.platform == 'windows'
        timeout-minutes: 20
        run: |
          $env:SENTRY_TEST_PLATFORM = "Desktop"
          $env:SENTRY_TEST_APP = "samples/IntegrationTest/Build/test.exe"
          Invoke-Pester -Path test/IntegrationTest/Integration.Tests.ps1 -CI

      - name: Upload test results on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testapp-desktop-logs-${{ inputs.platform }}${{ inputs.architecture && format('-{0}', inputs.architecture) || '' }}${{ inputs.backend && format('-{0}', inputs.backend) || '' }}-${{ inputs.unity-version }}
          path: |
            test/IntegrationTest/results/
            player-probe.log
            player-probe.dmp
          retention-days: 14
