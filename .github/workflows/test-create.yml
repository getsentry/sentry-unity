name: "Test: Create Project"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
    secrets:
      UNITY_LICENSE_SERVER_CONFIG:
        required: true

defaults:
  run:
    shell: pwsh

jobs:
  create:
    name: ${{ inputs.unity-version }}
    runs-on: ubuntu-24.04
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Restore IntegrationTest Project cache
      id: cache-project
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: samples/IntegrationTest
        key: IntegrationTest-Project-${{ env.UNITY_VERSION }}-${{ hashFiles('test/Scripts.Integration.Test/**') }}-v1
        restore-keys: |
          IntegrationTest-Project-${{ env.UNITY_VERSION }}-

    - name: Setup Unity
      if: steps.cache-project.outputs.cache-hit != 'true'
      uses: ./.github/actions/setup-unity
      with:
        unity-version: ${{ inputs.unity-version }}
        license-server-config: ${{ secrets.UNITY_LICENSE_SERVER_CONFIG }}

    - name: Create new Project
      if: steps.cache-project.outputs.cache-hit != 'true'
      run: ./test/Scripts.Integration.Test/create-project.ps1 -UnityPath "$env:UNITY_PATH"

    - name: Save IntegrationTest Project cache
      if: github.ref == 'refs/heads/main' && steps.cache-project.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: samples/IntegrationTest
        key: IntegrationTest-Project-${{ env.UNITY_VERSION }}-${{ hashFiles('test/Scripts.Integration.Test/**') }}-v1

    # We create tar explicitly because upload-artifact is slow for many files.
    - name: Create archive
      run: tar -cvzf test-project.tar.gz samples/IntegrationTest

    - name: Upload project
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-${{ env.UNITY_VERSION }}
        if-no-files-found: error
        path: test-project.tar.gz
        # Lower retention period - we only need this to retry CI.
        retention-days: 14 
