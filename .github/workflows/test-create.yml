name: "Test: Create Project"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
    secrets:
      UNITY_LICENSE_SERVER_CONFIG:
        required: true

defaults:
  run:
    shell: pwsh

jobs:
  create:
    name: ${{ inputs.unity-version }}
    # Unity 6 runs on the Unity CLI, on 24.04: the newest Ubuntu Unity supports (26.04 lacks libxml2.so.2 for IL2CPP).
    runs-on: ${{ fromJSON(inputs.unity-version) >= 6000 && 'ubuntu-24.04' || 'ubuntu-latest' }}
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      UNITY_VERSION: ${{ inputs.unity-version }}

    steps:
    - name: Checkout
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Docker Login
      if: ${{ fromJSON(inputs.unity-version) < 6000 }}
      uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
      with:
        registry: ghcr.io
        username: ${{ env.GITHUB_ACTOR }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Restore IntegrationTest Project cache
      id: cache-project
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: samples/IntegrationTest
        key: IntegrationTest-Project-${{ env.UNITY_VERSION }}-${{ hashFiles('test/Scripts.Integration.Test/**') }}-v1
        restore-keys: |
          IntegrationTest-Project-${{ env.UNITY_VERSION }}-

    - name: Start the Unity docker container
      if: steps.cache-project.outputs.cache-hit != 'true' && fromJSON(inputs.unity-version) < 6000
      run: ./scripts/ci-docker.sh "$UNITY_VERSION" 'base' "$UNITY_LICENSE_SERVER_CONFIG"
      shell: bash
      env:
        UNITY_LICENSE_SERVER_CONFIG: ${{ secrets.UNITY_LICENSE_SERVER_CONFIG }}

    - name: Setup Unity
      if: steps.cache-project.outputs.cache-hit != 'true' && fromJSON(inputs.unity-version) >= 6000
      run: ./scripts/setup-unity.ps1 -UnityVersion "$env:UNITY_VERSION"
      env:
        UNITY_LICENSE_SERVER_CONFIG: ${{ secrets.UNITY_LICENSE_SERVER_CONFIG }}

    - name: Create new Project
      if: steps.cache-project.outputs.cache-hit != 'true'
      run: ./test/Scripts.Integration.Test/create-project.ps1 -UnityPath "$env:UNITY_PATH"

    - name: Save IntegrationTest Project cache
      if: github.ref == 'refs/heads/main' && steps.cache-project.outputs.cache-hit != 'true'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: samples/IntegrationTest
        key: IntegrationTest-Project-${{ env.UNITY_VERSION }}-${{ hashFiles('test/Scripts.Integration.Test/**') }}-v1

    # We create tar explicitly because upload-artifact is slow for many files.
    - name: Create archive
      run: tar -cvzf test-project.tar.gz samples/IntegrationTest

    - name: Upload project
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-${{ env.UNITY_VERSION }}
        if-no-files-found: error
        path: test-project.tar.gz
        # Lower retention period - we only need this to retry CI.
        retention-days: 14 
