name: "Test: Compile iOS"
on:
  workflow_call:
    inputs:
      unity-version:
        required: true
        type: string
      init-type:
        required: true
        type: string

defaults:
  run:
    shell: pwsh

jobs:
  compile:
    name: ${{ inputs.unity-version }} ${{ inputs.init-type }}
    runs-on: 'macos-14' # Pinning to get the oldest, supported version of iOS simulator
    env:
      UNITY_VERSION: ${{ inputs.unity-version }}
      INIT_TYPE: ${{ inputs.init-type }}
            
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download app project
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: testapp-ios-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}

      - name: Extract app project
        run: tar -xvzf "test-app-$env:INIT_TYPE.tar.gz"

      # Envelope capture: sentry-cli takes its upload URL from the DSN, so every debug file it
      # uploads during the build lands in the capture output. See docs/envelope-capture.md.
      - name: Start envelope capture server
        run: ./test/Scripts.Integration.Test/start-capture-server.ps1 -Platform "ios-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}" -Output "test/IntegrationTest/symbols/ios-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}"

      - name: iOS test
        run: ./scripts/compile-xcode-project.ps1 -iOSMinVersion "17.0"
        timeout-minutes: 20

      - name: Assert symbols and sources were uploaded
        run: ./test/Scripts.Integration.Test/assert-symbol-upload.ps1 -LogPath samples/IntegrationTest/Build/sentry-symbols-upload.log

      - name: Upload integration-test project on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-project-ios-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}-compiled
          path: |
            samples/IntegrationTest
            !samples/IntegrationTest/Build/*_BackUpThisFolder_ButDontShipItWithYourGame
          # Lower retention period - we only need this to retry CI.
          retention-days: 14

      - name: List downloaded files
        run: |
          Get-ChildItem -Path "samples/IntegrationTest/Build" -Recurse
          
      - name: Upload app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: testapp-ios-compiled-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}
          # Collect app but ignore the files that are not required for the test.
          path: |
            samples/IntegrationTest/Build/archive/Unity-iPhone/Build/Products/Release-iphonesimulator/
            !**/Release-iphonesimulator/*.dSYM
            !**/Release-iphonesimulator/UnityFramework.framework/*
          # Lower retention period - we only need this to retry CI.
          retention-days: 14

      - name: Stop envelope capture server
        if: ${{ always() }}
        run: |
          try { Invoke-WebRequest -Uri "http://127.0.0.1:8787/STOP" -TimeoutSec 5 -UseBasicParsing | Out-Null }
          catch { Write-Host "Capture server already gone" }

      - name: Upload captured debug files
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: symbols-ios-${{ env.UNITY_VERSION }}-${{ env.INIT_TYPE }}
          path: test/IntegrationTest/symbols/
          if-no-files-found: warn
          retention-days: 14
