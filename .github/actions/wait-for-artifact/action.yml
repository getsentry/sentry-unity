name: 'Wait for and download artifact'
description: 'Polls the run''s artifacts API until the named artifact appears, then downloads it.'
inputs:
  name:
    description: 'Artifact name'
    required: true
  path:
    description: 'Destination path for the artifact contents'
    required: false
  producer:
    description: 'Name prefix of the job that uploads the artifact; stop waiting once it has failed'
    required: false

runs:
  using: composite
  steps:
    - name: Wait for ${{ inputs.name }}
      env:
        GH_TOKEN: ${{ github.token }}
        NAME: ${{ inputs.name }}
        PRODUCER: ${{ inputs.producer }}
      shell: pwsh
      run: |
        for ($i = 0; $i -lt 120; $i++) {
          # Read the producer state before the artifact, so an upload in between is not missed
          $failed = if ($env:PRODUCER) {
            gh api --paginate "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/attempts/$env:GITHUB_RUN_ATTEMPT/jobs?per_page=100" --jq '.jobs[] | select(.status == "completed" and .conclusion != "success") | .name' |
              Where-Object { $_.StartsWith($env:PRODUCER) }
          }
          $count = gh api "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?name=$env:NAME" --jq .total_count
          if ($LASTEXITCODE -eq 0) {
            if ([int]$count -gt 0) {
              exit 0
            }
            if ($failed) {
              Write-Output "::error::$($failed -join ', ') failed, $env:NAME will not be uploaded"
              exit 1
            }
          }
          Start-Sleep -Seconds 30
        }
        Write-Error "Timed out after 60 minutes waiting for artifact: $env:NAME"
        exit 1

    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ inputs.name }}
        path: ${{ inputs.path }}
